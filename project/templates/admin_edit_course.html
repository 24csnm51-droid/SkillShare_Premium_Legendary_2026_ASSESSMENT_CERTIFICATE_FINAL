{% extends 'base.html' %}{% block title %}Edit Course | SkillShare{% endblock %}{% block content %}<main class="admin-page narrow-admin"><div class="admin-top"><div><span class="eyebrow">CATALOGUE EDITOR</span><h1>Edit <em>{{ course['title'] }}</em></h1><p>Update course information and the YouTube learning resource.</p></div><a class="outline-btn" href="/admin">← Back to Admin</a></div><section class="admin-panel"><form method="POST" class="admin-form"><label>Course title<input name="title" value="{{ course['title'] }}" required></label><label>Icon<input name="icon" value="{{ course['icon'] }}" maxlength="6"></label><label>Category<input name="category" value="{{ course['category'] }}" required></label><label>Level<select name="level"><option {% if course['level']=='Beginner' %}selected{% endif %}>Beginner</option><option {% if course['level']=='Intermediate' %}selected{% endif %}>Intermediate</option><option {% if course['level']=='Advanced' %}selected{% endif %}>Advanced</option></select></label><label>Duration<input name="duration" value="{{ course['duration'] }}" required></label><label>Accent<select name="accent">{% for a in ['blue','purple','teal','pink','orange','gold'] %}<option {% if course['accent']==a %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></label><label>Students<input name="students" type="number" value="{{ course['students'] }}"></label><label>Rating<input name="rating" type="number" step="0.1" max="5" value="{{ course['rating'] }}"></label><label>Lessons<input name="lessons" type="number" value="{{ course['lessons'] }}"></label><label>YouTube URL<input name="video_url" value="{{ course['video_url'] }}" required></label><label class="wide-field">Description<textarea name="description" required>{{ course['description'] }}</textarea></label><label class="check"><input type="checkbox" name="featured" {% if course['featured'] %}checked{% endif %}> Feature on Discover</label><button class="gold-btn" type="submit">Save course changes →</button></form></section></main>{% endblock %}
