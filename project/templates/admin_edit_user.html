{% extends 'base.html' %}{% block title %}Edit Learner | SkillShare{% endblock %}{% block content %}<main class="admin-page narrow-admin"><div class="admin-top"><div><span class="eyebrow">LEARNER ACCOUNT</span><h1>Edit <em>{{ user['fullname'] }}</em></h1><p>Update learner profile details or set a new password.</p></div><a class="outline-btn" href="/admin">← Back to Admin</a></div><section class="admin-panel"><form method="POST" class="admin-form"><label>Full name<input name="fullname" value="{{ user['fullname'] }}" required></label><label>Mobile number<input name="phone" value="{{ user['phone'] }}" maxlength="10" required></label><label class="wide-field">Email<input type="email" name="email" value="{{ user['email'] }}" required></label><label class="wide-field">New password <span class="field-help">Leave empty to keep the current password</span><input type="password" name="new_password" minlength="6" placeholder="Optional new password"></label><button class="gold-btn" type="submit">Save learner →</button></form></section></main>{% endblock %}
